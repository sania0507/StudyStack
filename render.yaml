# Render blueprint for the StudyStack backend.
#
# Each service builds the shared backend/Dockerfile. Render has no field for
# setting a working directory, so every command changes into its service
# folder first (the command runs through a shell).
#
# Deploy: Render Dashboard -> New -> Blueprint -> point at this repo.
# Then fill in every value marked sync: false.
#
# The database comes from Neon or Supabase (both free) and is passed in as
# DATABASE_URL. A managed RabbitMQ instance (CloudAMQP's free plan) supplies
# RABBITMQ_URL.

services:
  - type: web
    name: studystack-auth
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: cd /app/auth-service && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # auth-service owns the users table and migrates it itself.
      - key: MIGRATE_ON_START
        value: "true"
      - key: CREATE_TABLES_ON_START
        value: "false"

  - type: web
    name: studystack-tasks
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: cd /app/main-app && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: studystack-auth
          envVarKey: JWT_SECRET_KEY
      - key: RABBITMQ_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # The migrations own the task-service schema.
      - key: MIGRATE_ON_START
        value: "true"
      - key: CREATE_TABLES_ON_START
        value: "false"

  - type: web
    name: studystack-analytics
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: cd /app/analytics-service && python init_tables.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: studystack-auth
          envVarKey: JWT_SECRET_KEY
      - key: RABBITMQ_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # init_tables.py creates processed_events itself.
      - key: CREATE_TABLES_ON_START
        value: "false"

  # Scheduled reminder worker from milestone 7.
  - type: worker
    name: studystack-reminders
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: cd /app/main-app && python reminder_worker.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: studystack-auth
          envVarKey: JWT_SECRET_KEY
      - key: RABBITMQ_URL
        sync: false
      # Only the task service migrates; this worker just reads the schema.
      - key: CREATE_TABLES_ON_START
        value: "false"

  # Consumes session/task events so analytics has a durable record.
  - type: worker
    name: studystack-analytics-consumer
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: cd /app/analytics-service && python consumer.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: studystack-auth
          envVarKey: JWT_SECRET_KEY
      - key: RABBITMQ_URL
        sync: false
      - key: CREATE_TABLES_ON_START
        value: "false"
